name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        run: git clone --branch main --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          set -e

          repo_url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          deploy_dir="$(mktemp -d)"

          if git ls-remote --exit-code --heads "$repo_url" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$repo_url" "$deploy_dir"
          else
            git clone --branch main --single-branch "$repo_url" "$deploy_dir"
            cd "$deploy_dir"
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          find "$deploy_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. "$deploy_dir"/

          cd "$deploy_dir"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No deployment changes"
            exit 0
          fi

          git commit -m "Deploy ${{ github.sha }}"
          git push origin gh-pages